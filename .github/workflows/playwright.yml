name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI: "true"
      BASE_URL: ${{ secrets.BASE_URL }}
      GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
      PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run API tests
        run: npm run test:api

      - name: Upload API blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-api
          path: blob-report-api/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload API test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-api
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI: "true"
      UI_BASE_URL: ${{ secrets.UI_BASE_URL }}
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
      PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npm run test:ui

      - name: Upload UI blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-ui
          path: blob-report-ui/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload UI test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ui
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  kafka-tests:
    name: Kafka Tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: "true"
      KAFKA_BROKER_URL: ${{ secrets.KAFKA_BROKER_URL }}
      KAFKA_TOPIC: ${{ secrets.KAFKA_TOPIC }}
      PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report-kafka
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and pull Kafka image
        shell: bash
        run: |
          docker pull apache/kafka:3.9.0 &
          KAFKA_PULL_PID=$!

          npm ci

          wait "$KAFKA_PULL_PID"

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run Kafka tests
        run: npm run test:kafka

      - name: Upload Kafka blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-kafka
          path: blob-report-kafka/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Kafka test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-kafka
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  merge-reports:
    name: Merge Reports
    needs:
      - api-tests
      - ui-tests
      - kafka-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into combined HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload combined HTML report
        uses: actions/upload-artifact@v4
        with:
          name: combined-playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: error

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo "## Test Suite Results"
            echo "- API: ${{ needs.api-tests.result }}"
            echo "- UI: ${{ needs.ui-tests.result }}"
            echo "- Kafka: ${{ needs.kafka-tests.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
